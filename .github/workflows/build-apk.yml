name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '20.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Capacitor & Assets Generator
        run: |
          npm install
          npm install -D @capacitor/assets

      - name: Download Stockfish.js for offline APK
        run: |
          mkdir -p www
          curl -L -f -o www/stockfish.js "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js" || \
          curl -L -f -o www/stockfish.js "https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js" || \
          echo "Stockfish download skipped, builtin engine will be used"

      - name: Add Android platform & sync assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Chess Launcher Icons for Android
        run: |
          pip install --quiet pillow || true
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android --iconBackgroundColor '#090d16' --iconBackgroundColorDark '#090d16' --splashBackgroundColor '#090d16' --splashBackgroundColorDark '#090d16' || true
            python3 - << 'PYEOF'
          import os
          from PIL import Image

          src = "assets/icon.png"
          res_root = "android/app/src/main/res"
          if os.path.exists(src) and os.path.isdir(res_root):
              base_img = Image.open(src).convert("RGBA")
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192
              }
              for folder, px in sizes.items():
                  dpath = os.path.join(res_root, folder)
                  os.makedirs(dpath, exist_ok=True)
                  resized = base_img.resize((px, px), Image.LANCZOS)
                  resized.save(os.path.join(dpath, "ic_launcher.png"), "PNG")
                  resized.save(os.path.join(dpath, "ic_launcher_round.png"), "PNG")
                  fg_size = int(px * 2.25)
                  canvas = Image.new("RGBA", (fg_size, fg_size), (9, 13, 22, 255))
                  inner = base_img.resize((int(fg_size * 0.68), int(fg_size * 0.68)), Image.LANCZOS)
                  offset = (fg_size - inner.width) // 2
                  canvas.paste(inner, (offset, offset), inner)
                  canvas.save(os.path.join(dpath, "ic_launcher_foreground.png"), "PNG")

              anydpi = os.path.join(res_root, "mipmap-anydpi-v26")
              os.makedirs(anydpi, exist_ok=True)
              values_dir = os.path.join(res_root, "values")
              os.makedirs(values_dir, exist_ok=True)
              with open(os.path.join(values_dir, "ic_launcher_background.xml"), "w", encoding="utf-8") as f:
                  f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#090D16</color>\n</resources>\n')
              adaptive_xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          """
              with open(os.path.join(anydpi, "ic_launcher.xml"), "w", encoding="utf-8") as f:
                  f.write(adaptive_xml)
              with open(os.path.join(anydpi, "ic_launcher_round.xml"), "w", encoding="utf-8") as f:
                  f.write(adaptive_xml)
          PYEOF
          fi

      - name: Allow cleartext in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightChessPro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
