name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '20.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Capacitor & Assets Generator
        run: |
          npm install
          npm install -D @capacitor/assets

      - name: Download Stockfish.js for offline APK
        run: |
          mkdir -p www
          curl -L -f -o www/stockfish.js "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js" || \
          curl -L -f -o www/stockfish.js "https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js" || \
          echo "Stockfish download skipped, builtin engine will be used"

      - name: Add Android platform & sync assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Chess Launcher Icons for Android
        run: |
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#090d16' --iconBackgroundColorDark '#090d16' --splashBackgroundColor '#090d16' --splashBackgroundColorDark '#090d16'
          fi

      - name: Allow cleartext in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightChessPro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
